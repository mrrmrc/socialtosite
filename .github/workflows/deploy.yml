name: Deploy via SFTP

# Deploy MANUALE: parte solo quando lo avvii tu dal tab "Actions" di GitHub
# (pulsante "Run workflow"). Niente deploy automatici ad ogni push.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installa lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Carica i file via SFTP
        env:
          HOST: ${{ secrets.FTP_HOST }}
          USER: ${{ secrets.FTP_USER }}
          PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -c "
          set sftp:auto-confirm yes;
          set net:max-retries 3;
          set net:timeout 20;
          open -u \"$USER\",\"$PASS\" sftp://$HOST;
          mirror -R --verbose \
            --exclude-glob .git* \
            --exclude .github/ \
            --exclude config/config.php \
            --exclude db/ \
            --exclude README.md \
            ./ /public_html/;
          put -O /public_html frontend/index.html -o index.html;
          "
