name: Deploy via SFTP

# Deploy AUTOMATICO: parte ad ogni push su main.
# Resta disponibile anche l'avvio manuale dal tab "Actions" (Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installa lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Genera info release
        run: |
          DEPLOYED_AT="$(TZ=Europe/Rome date '+%Y-%m-%d %H:%M:%S')"
          DAY_INDEX="$(TZ=Europe/Rome date '+%u')"
          DAYS=(lunedì martedì mercoledì giovedì venerdì sabato domenica)
          DEPLOYED_DAY="${DAYS[$((DAY_INDEX - 1))]}"
          RELEASE="release-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          cat > deploy-info.json <<EOF
          {
            "deployed_at": "$DEPLOYED_AT",
            "deployed_day": "$DEPLOYED_DAY",
            "timezone": "Europe/Rome",
            "release": "$RELEASE"
          }
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend (Vite)
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Carica i file via SFTP
        # Le credenziali vivono in config/deploy.env (committato: repo PRIVATO).
        # Il file viene ESCLUSO dal mirror, così non finisce mai sul server web.
        run: |
          set -a
          . ./config/deploy.env
          set +a
          : "${FTP_HOST:?manca FTP_HOST in config/deploy.env}"
          : "${FTP_USER:?manca FTP_USER in config/deploy.env}"
          : "${FTP_PASS:?manca FTP_PASS in config/deploy.env}"
          echo "Credenziali lette da config/deploy.env (HOST=$FTP_HOST USER=$FTP_USER)"

          # Sposta la build di Vite (dist) nella root per il mirror
          cp -r frontend/dist/* ./

          lftp -c "
          set sftp:auto-confirm yes;
          set net:max-retries 3;
          set net:timeout 20;
          open -u \"$FTP_USER\",\"$FTP_PASS\" sftp://$FTP_HOST;
          mirror -R --verbose \
            --exclude-glob .git* \
            --exclude .github/ \
            --exclude config/config.php \
            --exclude config/deploy.env \
            --exclude db/ \
            --exclude frontend/ \
            --exclude README.md \
            --exclude CLAUDE.md \
            ./ public_html/;
          "
