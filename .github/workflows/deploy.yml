name: Deploy via SFTP

# Deploy AUTOMATICO: parte ad ogni push su main.
# Resta disponibile anche l'avvio manuale dal tab "Actions" (Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installa lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Genera info release
        run: |
          DEPLOYED_AT="$(TZ=Europe/Rome date '+%Y-%m-%d %H:%M:%S')"
          DAY_INDEX="$(TZ=Europe/Rome date '+%u')"
          DAYS=(lunedì martedì mercoledì giovedì venerdì sabato domenica)
          DEPLOYED_DAY="${DAYS[$((DAY_INDEX - 1))]}"
          RELEASE="release-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          cat > deploy-info.json <<EOF
          {
            "deployed_at": "$DEPLOYED_AT",
            "deployed_day": "$DEPLOYED_DAY",
            "timezone": "Europe/Rome",
            "release": "$RELEASE"
          }
          EOF

      - name: Controlla la sintassi PHP
        # Cancello prima del deploy: un errore di sintassi non deve poter
        # arrivare in produzione e lasciare il sito su pagina bianca.
        run: |
          errori=0
          while IFS= read -r -d '' file; do
            php -l "$file" > /dev/null 2>&1 || { echo "::error file=$file::Errore di sintassi PHP"; php -l "$file"; errori=1; }
          done < <(find api public cron config -name '*.php' -print0)
          [ "$errori" -eq 0 ] || { echo "Deploy annullato: correggi gli errori di sintassi."; exit 1; }
          echo "Sintassi PHP verificata."

      - name: Esegui i test
        run: |
          php tools/test_html_sanitizer.php
          php tools/test_seo_feedback.php
          php tools/test_reachability_contacts.php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend (Vite)
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Prepara la release
        # Lista di INCLUSIONE, non di esclusione. Con una lista di esclusione
        # ogni file nuovo finisce online per default: è così che script di
        # debug e di migrazione sono arrivati in produzione. Qui va online
        # soltanto ciò che è elencato qui sotto.
        run: |
          rm -rf release
          mkdir -p release

          # Backend e sito pubblico
          cp -r api      release/
          cp -r public   release/
          cp -r cron     release/
          cp -r scraper  release/

          # Build del frontend (Vite) nella root del sito
          cp -r frontend/dist/. release/

          # File di servizio della root
          cp .htaccess robots.txt deploy-info.json release/
          # Verifica di proprietà del dominio per Search Console
          cp google*.html release/ 2>/dev/null || true

          # config/ contiene SOLO i file di esempio: config.php e keys.php
          # vivono unicamente sul server e non vanno mai sovrascritti.
          mkdir -p release/config
          cp config/db.php release/config/

          # Cartella dei media caricati: si crea se manca, senza toccare
          # quelli già presenti sul server.
          mkdir -p release/public/media

          echo "── Contenuto della release ──"
          find release -type f | sort | head -50
          echo "totale file: $(find release -type f | wc -l)"

          # Rete di sicurezza: se un file che non deve mai uscire finisse
          # nella release, il deploy si ferma qui invece di pubblicarlo.
          if find release -name 'config.php' -o -name 'keys.php' -o -name '*.env' \
                          -o -name 'reset-*' -o -name 'test_*' -o -name 'test-*' \
                          -o -name 'debug*' -o -name 'diagnostic*' -o -name '*.sql' \
             | grep -q .; then
            echo "::error::La release contiene file che non devono essere pubblicati."
            find release -name 'config.php' -o -name 'keys.php' -o -name '*.env' \
                         -o -name 'reset-*' -o -name 'test_*' -o -name 'test-*' \
                         -o -name 'debug*' -o -name 'diagnostic*' -o -name '*.sql'
            exit 1
          fi

      - name: Carica i file via FTPS
        # Credenziali: prima i Secrets del repository, in mancanza si ricade su
        # config/deploy.env (committato).
        #
        # DEBITO DA SALDARE: le credenziali in deploy.env sono in chiaro nella
        # history di git. Appena i tre Secrets sono impostati, questo passo li
        # usa da solo senza altre modifiche: basta cancellare config/deploy.env
        # e rimetterlo in .gitignore.
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASS" ]; then
            echo "Credenziali lette dai Secrets del repository."
          elif [ -f ./config/deploy.env ]; then
            echo "::warning::Secrets non impostati: uso config/deploy.env. Sposta le credenziali nei Secrets appena possibile."
            set -a
            . ./config/deploy.env
            set +a
          fi
          : "${FTP_HOST:?nessuna credenziale: imposta i Secrets FTP_* oppure fornisci config/deploy.env}"
          : "${FTP_USER:?nessuna credenziale: imposta i Secrets FTP_* oppure fornisci config/deploy.env}"
          : "${FTP_PASS:?nessuna credenziale: imposta i Secrets FTP_* oppure fornisci config/deploy.env}"
          echo "Deploy verso $FTP_HOST con l'utente $FTP_USER"

          # Aruba (ProFTPD) espone solo FTP/FTPS su porta 21: NON SFTP (22 chiusa).
          # Usiamo FTP con TLS opportunistico (AUTH TLS) e verifica certificato off.
          lftp -c "
          set ftp:ssl-allow true;
          set ftp:ssl-force false;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          set net:max-retries 3;
          set net:timeout 20;
          set net:persist-retries 3;
          open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_HOST;
          mirror -R --verbose release/ httpdocs/;
          "
