name: deployvps - FTP only

# CANONICAL PRODUCTION DEPLOY.
# A normal push to main is NOT a production deployment.
# Automatic deployment runs only when the HEAD commit message contains [deployvps].
# Docker operations are intentionally absent and forbidden from this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deployvps to confirm production FTP deploy'
        required: true
        type: string

jobs:
  deploy:
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deployvps]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'deployvps')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Guard - production deploy must be main and FTP only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          echo "deployvps: main -> build -> FTP/FTPS -> production"
          echo "Docker rebuild/restart/copy is NOT part of deployvps."

      - name: Install lftp
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          if command -v lftp >/dev/null 2>&1; then
            echo "lftp is already available"
            exit 0
          fi
          # GitHub's Azure mirror can occasionally stall for many minutes.
          # Keep the canonical FTP deploy deterministic by using Ubuntu's
          # public mirror and bounded network retries.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          apt_options=(-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          for attempt in 1 2 3; do
            if sudo apt-get "${apt_options[@]}" update && sudo apt-get "${apt_options[@]}" install -y --fix-missing lftp; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Unable to install lftp after $attempt attempts."
              exit 1
            fi
            echo "::warning::lftp installation attempt $attempt failed; clearing the package cache before retrying."
            sudo apt-get clean
            sleep $((attempt * 5))
          done

      - name: Generate release identity
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_AT="$(TZ=Europe/Rome date '+%Y-%m-%d %H:%M:%S')"
          RELEASE="deployvps-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          cat > deploy-info.json <<EOF
          {
            "deployed_at": "$DEPLOYED_AT",
            "timezone": "Europe/Rome",
            "release": "$RELEASE",
            "commit": "$GITHUB_SHA",
            "method": "deployvps-ftp"
          }
          EOF
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          errors=0
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null 2>&1 || { echo "::error file=$file::PHP syntax error"; php -l "$file"; errors=1; }
          done < <(printf '%s\0' \
            api/index.php \
            api/middleware/jwt.php api/middleware/response.php api/middleware/ratelimit.php api/middleware/logger.php \
            api/routes/auth.php \
            api/services/sync.php api/services/ingest.php api/services/editorial_engine.php \
            api/services/visibility.php api/services/seo_foundation.php api/services/reachability.php \
            api/services/raw_import.php api/services/apify_client.php api/services/website_source.php api/services/profile_analyzer.php \
            api/services/admin_console.php api/services/editorial_supervisor.php api/services/provider_config.php \
            api/services/ai.php api/services/content_ideas.php \
            public/site.php public/discover.php public/sitemap.php public/site-professional.php \
            config/db.php)
          [ "$errors" -eq 0 ] || exit 1

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          # php tools/test_website_source_security.php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Prepare production release
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          PUBLIC_BASE_URL: https://allsocialtoweb.com
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$APIFY_API_TOKEN" ]; then
            echo "::error::APIFY_API_TOKEN must be configured as a repository secret."
            exit 1
          fi
          if ! apify_status="$(curl -sS -o /tmp/apify-token-check.json -w '%{http_code}' --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $APIFY_API_TOKEN" 'https://api.apify.com/v2/users/me')"; then
            echo "::error::Unable to validate APIFY_API_TOKEN because the Apify API is unreachable."
            exit 1
          fi
          if [ "$apify_status" != "200" ]; then
            echo "::error::APIFY_API_TOKEN was rejected by Apify (HTTP $apify_status)."
            exit 1
          fi
          rm -f /tmp/apify-token-check.json
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY must be configured for user profiling."
            exit 1
          fi
          if ! gemini_status="$(curl -sS -o /tmp/gemini-key-check.json -w '%{http_code}' --connect-timeout 10 --max-time 30 -H "x-goog-api-key: $GEMINI_API_KEY" 'https://generativelanguage.googleapis.com/v1beta/models?pageSize=1')"; then
            echo "::error::Unable to validate GEMINI_API_KEY because the Gemini API is unreachable."
            exit 1
          fi
          if [ "$gemini_status" != "200" ]; then
            echo "::error::GEMINI_API_KEY was rejected by Gemini (HTTP $gemini_status). Replace the GitHub Actions secret before deploying."
            exit 1
          fi
          rm -f /tmp/gemini-key-check.json
          rm -rf release
          mkdir -p release

          mkdir -p release/api/middleware release/api/routes release/api/services
          cp api/index.php release/api/
          cp api/middleware/{jwt,response,ratelimit,logger}.php release/api/middleware/
          cp api/routes/{auth,migrate,upload,setup_admin}.php release/api/routes/
          cp api/services/{sync,ingest,editorial_engine,visibility,seo_foundation,reachability}.php release/api/services/
          cp api/services/{raw_import,apify_client,website_source,profile_analyzer,admin_console,editorial_supervisor,provider_config,ai,content_ideas}.php release/api/services/
          cp -r frontend/dist/. release/
          cp .htaccess robots.txt deploy-info.json release/
          cp google*.html release/ 2>/dev/null || true

          mkdir -p release/config
          cp config/db.php release/config/
          printf '%s\n' '<?php' > release/config/runtime-secrets.php
          append_secret() {
            local name="$1" value="$2" encoded
            [ -n "$value" ] || return 0
            encoded="$(printf '%s' "$value" | base64 -w0)"
            printf "if (!defined('%s')) define('%s', base64_decode('%s'));\n" "$name" "$name" "$encoded" \
              >> release/config/runtime-secrets.php
          }
          append_secret SOCIALTOSITE_RUNTIME_APIFY_API_TOKEN "$APIFY_API_TOKEN"
          append_secret SOCIALTOSITE_RUNTIME_GEMINI_API_KEY "$GEMINI_API_KEY"
          append_secret SOCIALTOSITE_RUNTIME_GEMINI_MODEL "$GEMINI_MODEL"
          append_secret SOCIALTOSITE_RUNTIME_BASE_URL "$PUBLIC_BASE_URL"
          mkdir -p release/public/media
          cp public/{site,discover,sitemap,site-professional}.php release/public/

          if find release \( -name 'config.php' -o -name 'keys.php' -o -name '*.env' \
                           -o -name 'reset-*' -o -name 'test_*' -o -name 'test-*' \
                           -o -name 'debug*' -o -name 'diagnostic*' -o -name '*.sql' \) \
             | grep -q .; then
            echo "::error::Forbidden file found in production release."
            exit 1
          fi

          echo "Release files: $(find release -type f | wc -l)"

      - name: Upload release to VPS via FTP/FTPS
        timeout-minutes: 10
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Set repository secret FTP_HOST}"
          : "${FTP_USER:?Set repository secret FTP_USER}"
          : "${FTP_PASS:?Set repository secret FTP_PASS}"
          FTP_REMOTE_DIR="${FTP_REMOTE_DIR:-.}"

          echo "deployvps FTP host: $FTP_HOST"
          echo "deployvps remote directory: $FTP_REMOTE_DIR"

          lftp -c "
          set ftp:ssl-allow true;
          set ftp:ssl-force false;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          set net:max-retries 5;
          set net:timeout 30;
          set net:persist-retries 5;
          set net:connection-limit 6;
          open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_HOST;
          rm -f \"$FTP_REMOTE_DIR/api/auth/callback.php\";
          rm -f \"$FTP_REMOTE_DIR/api/auth/tiktok_callback.php\";
          rm -f \"$FTP_REMOTE_DIR/api/cron/fetch_seo.php\";
          rm -f \"$FTP_REMOTE_DIR/api/middleware/crypto.php\";
          rm -f \"$FTP_REMOTE_DIR/api/services/social_oauth.php\";
          mirror -R --delete --no-perms --parallel=3 --exclude-glob config/config.php --exclude-glob config/keys.php --exclude '^(public/media|scraper|storage)(/.*)?$' release/ \"$FTP_REMOTE_DIR\";
          "

      - name: Verify deployed release on production
        shell: bash
        run: |
          set -euo pipefail
          url="https://allsocialtoweb.com/deploy-info.json?ts=${GITHUB_RUN_ID}"
          echo "Verifying $url"
          body="$(curl -kfsS --retry 4 --retry-delay 3 "$url")"
          echo "$body"
          echo "$body" | grep -Fq "\"release\": \"$RELEASE\"" || {
            echo "::error::FTP completed but production is not serving release $RELEASE. Check FTP_REMOTE_DIR / VPS volume mapping."
            exit 1
          }

          # deploy-info.json alone doesn't prove the app actually works: the FTP
          # mirror uploads many files in parallel over 8 connections and is not
          # atomic, so a single dropped transfer (e.g. the main JS bundle) can
          # leave index.html referencing a file that 404s while everything else
          # looks fine. Fetch the real homepage and confirm every asset it
          # references actually loads before calling the deploy good.
          html_url="https://allsocialtoweb.com/?ts=${GITHUB_RUN_ID}"
          html="$(curl -kfsS --retry 4 --retry-delay 3 "$html_url")"
          assets="$(printf '%s' "$html" | grep -oE '/assets/[^"]+\.(js|css)' | sort -u)"
          if [ -z "$assets" ]; then
            echo "::error::Could not find any /assets/*.js or *.css reference in the deployed homepage."
            exit 1
          fi
          echo "Checking deployed assets:"
          failed=0
          while IFS= read -r asset; do
            code="$(curl -kso /dev/null -w '%{http_code}' --retry 3 --retry-delay 2 "https://allsocialtoweb.com${asset}")"
            echo "  $code  $asset"
            [ "$code" = "200" ] || failed=1
          done <<< "$assets"
          if [ "$failed" -eq 1 ]; then
            echo "::error::One or more assets referenced by the deployed homepage are not reachable. The FTP upload likely dropped a file mid-transfer; re-run this workflow."
            exit 1
          fi
          echo "deployvps verified: $RELEASE is live on https://allsocialtoweb.com/ and all referenced assets load."
