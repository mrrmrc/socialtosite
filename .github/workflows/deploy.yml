name: Deploy via SFTP

# Deploy AUTOMATICO: parte ad ogni push su main.
# Resta disponibile anche l'avvio manuale dal tab "Actions" (Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Installa lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Verifica i secret FTP
        # Diagnostica: non stampa MAI i valori, solo se sono presenti e la loro
        # lunghezza. Fa fallire subito con messaggio chiaro se manca qualcosa.
        env:
          HOST: ${{ secrets.FTP_HOST }}
          USER: ${{ secrets.FTP_USER }}
          PASS: ${{ secrets.FTP_PASS }}
        run: |
          fail=0
          [ -z "$HOST" ] && echo "::error::Secret FTP_HOST vuoto o assente" && fail=1
          [ -z "$USER" ] && echo "::error::Secret FTP_USER vuoto o assente" && fail=1
          [ -z "$PASS" ] && echo "::error::Secret FTP_PASS vuoto o assente" && fail=1
          echo "Lunghezze (caratteri): HOST=${#HOST} USER=${#USER} PASS=${#PASS}"
          if printf '%s' "$HOST" | grep -q '[[:space:]]'; then
            echo "::warning::FTP_HOST contiene spazi o a-capo: deve essere SOLO l'hostname (es. socialtosite.sviluppo.host)"
          fi
          if [ "$fail" = "1" ]; then
            echo "I secret vanno creati in: Settings -> Secrets and variables -> Actions -> Repository secrets"
            exit 1
          fi
          echo "Secret FTP presenti."

      - name: Prepara index.html nella root
        # La dashboard React vive in frontend/index.html ma deve essere servita
        # come / del dominio: la copio nella root così il mirror la carica
        # direttamente in /public_html/index.html (sovrascrive la pagina di
        # cortesia dell'hosting).
        run: cp frontend/index.html index.html

      - name: Carica i file via SFTP
        env:
          HOST: ${{ secrets.FTP_HOST }}
          USER: ${{ secrets.FTP_USER }}
          PASS: ${{ secrets.FTP_PASS }}
        run: |
          lftp -c "
          set sftp:auto-confirm yes;
          set net:max-retries 3;
          set net:timeout 20;
          open -u \"$USER\",\"$PASS\" sftp://$HOST;
          mirror -R --verbose \
            --exclude-glob .git* \
            --exclude .github/ \
            --exclude config/config.php \
            --exclude db/ \
            --exclude README.md \
            ./ /public_html/;
          "
