name: deployvps - FTP only

# CANONICAL PRODUCTION DEPLOY.
# A normal push to main is NOT a production deployment.
# Automatic deployment runs only when the HEAD commit message contains [deployvps].
# Docker operations are intentionally absent and forbidden from this workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deployvps to confirm production FTP deploy'
        required: true
        type: string

jobs:
  deploy:
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deployvps]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'deployvps')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Guard - production deploy must be main and FTP only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          echo "deployvps: main -> build -> FTP/FTPS -> production"
          echo "Docker rebuild/restart/copy is NOT part of deployvps."

      - name: Install lftp
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          if command -v lftp >/dev/null 2>&1; then
            echo "lftp is already available"
            exit 0
          fi
          # GitHub's Azure mirror can occasionally stall for many minutes.
          # Keep the canonical FTP deploy deterministic by using Ubuntu's
          # public mirror and bounded network retries.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          apt_options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y lftp

      - name: Generate release identity
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_AT="$(TZ=Europe/Rome date '+%Y-%m-%d %H:%M:%S')"
          RELEASE="deployvps-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          cat > deploy-info.json <<EOF
          {
            "deployed_at": "$DEPLOYED_AT",
            "timezone": "Europe/Rome",
            "release": "$RELEASE",
            "commit": "$GITHUB_SHA",
            "method": "deployvps-ftp"
          }
          EOF
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          errors=0
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null 2>&1 || { echo "::error file=$file::PHP syntax error"; php -l "$file"; errors=1; }
          done < <(find api public cron config -name '*.php' -print0)
          [ "$errors" -eq 0 ] || exit 1

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          php tools/test_html_sanitizer.php
          php tools/test_seo_feedback.php
          php tools/test_reachability_contacts.php
          php tools/test_content_ideas.php

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run build

      - name: Prepare production release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release

          cp -r api release/
          cp -r public release/
          cp -r cron release/
          [ ! -d scraper ] || cp -r scraper release/
          cp -r frontend/dist/. release/
          cp .htaccess robots.txt deploy-info.json release/
          cp google*.html release/ 2>/dev/null || true

          mkdir -p release/config
          cp config/db.php release/config/
          mkdir -p release/public/media

          if find release \( -name 'config.php' -o -name 'keys.php' -o -name '*.env' \
                           -o -name 'reset-*' -o -name 'test_*' -o -name 'test-*' \
                           -o -name 'debug*' -o -name 'diagnostic*' -o -name '*.sql' \) \
             | grep -q .; then
            echo "::error::Forbidden file found in production release."
            exit 1
          fi

          echo "Release files: $(find release -type f | wc -l)"

      - name: Upload release to VPS via FTP/FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Set repository secret FTP_HOST}"
          : "${FTP_USER:?Set repository secret FTP_USER}"
          : "${FTP_PASS:?Set repository secret FTP_PASS}"
          FTP_REMOTE_DIR="${FTP_REMOTE_DIR:-.}"

          echo "deployvps FTP host: $FTP_HOST"
          echo "deployvps remote directory: $FTP_REMOTE_DIR"

          lftp -c "
          set ftp:ssl-allow true;
          set ftp:ssl-force false;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          set net:max-retries 3;
          set net:timeout 20;
          set net:persist-retries 3;
          open -u \"$FTP_USER\",\"$FTP_PASS\" ftp://$FTP_HOST;
          mirror -R --verbose --no-perms --exclude-glob config/config.php --exclude-glob config/keys.php --exclude-glob public/media/* release/ \"$FTP_REMOTE_DIR\";
          "

      - name: Verify deployed release on production
        shell: bash
        run: |
          set -euo pipefail
          url="https://213.32.22.252/deploy-info.json?ts=${GITHUB_RUN_ID}"
          echo "Verifying $url"
          body="$(curl -kfsS --retry 4 --retry-delay 3 "$url")"
          echo "$body"
          echo "$body" | grep -Fq "\"release\": \"$RELEASE\"" || {
            echo "::error::FTP completed but production is not serving release $RELEASE. Check FTP_REMOTE_DIR / VPS volume mapping."
            exit 1
          }
          echo "deployvps verified: $RELEASE is live on https://213.32.22.252/"
