name: deploy-staging - Docker/SSH

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deployvps-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Prepara chiave SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Staging VPS via SSH/Docker
        shell: bash
        run: |
          ssh -T -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} << 'DEPLOY_SCRIPT'
          set -e
          mkdir -p /opt/socialtosite-staging
          cd /opt/socialtosite-staging

          if [ ! -d ".git" ]; then
            git clone -b staging https://github.com/${{ github.repository }}.git .
          else
            git fetch origin staging
            git reset --hard origin/staging
          fi

          echo "<?php" > config/config.php
          echo "define('JWT_SECRET', 'staging_secret_key_1234567890');" >> config/config.php

          docker compose -f docker-compose.staging.yml build

          echo "APIFY_API_TOKEN=${{ secrets.APIFY_API_TOKEN }}" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

          docker compose -f docker-compose.staging.yml up -d

          echo "Configurazione Crontab per l'ambiente di Staging..."
          crontab -l | grep -v 'docker exec socialtosite_web_staging' > /tmp/crontab.staging || true
          echo "*/10 * * * * docker exec socialtosite_web_staging php /var/www/html/cron/sync.php > /dev/null 2>&1" >> /tmp/crontab.staging
          echo "*/5 * * * * docker exec socialtosite_web_staging php /var/www/html/cron/publish.php > /dev/null 2>&1" >> /tmp/crontab.staging
          echo "0 * * * * docker exec socialtosite_web_staging php /var/www/html/cron/fetch_seo.php > /dev/null 2>&1" >> /tmp/crontab.staging
          echo "0 8 * * * docker exec socialtosite_web_staging php /var/www/html/cron/check_alerts.php > /dev/null 2>&1" >> /tmp/crontab.staging
          crontab /tmp/crontab.staging
          rm -f /tmp/crontab.staging

          docker exec socialtosite_app_staging bash -c "cat /var/log/apache2/error.log > /var/www/html/public/media/error_debug.txt; chmod 777 /var/www/html/public/media/error_debug.txt"
          docker logs --tail 50 socialtosite_db_staging
          echo "Staging Deploy completato con successo tramite Docker e Cron configurato!"
          DEPLOY_SCRIPT



