name: deploy-staging - Docker/SSH

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deployvps-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Prepara chiave SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Scrive la chiave e rimuove eventuali \r di Windows
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Disabilita il controllo host per evitare prompt interattivi
          ssh-keyscan -H ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Staging VPS via SSH/Docker
        shell: bash
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} << 'DEPLOY_SCRIPT'
          set -e
          mkdir -p /opt/socialtosite-staging
          cd /opt/socialtosite-staging

          if [ ! -d ".git" ]; then
            git clone -b staging https://github.com/${{ github.repository }}.git .
          else
            git fetch origin staging
            git reset --hard origin/staging
          fi

          docker compose -f docker-compose.staging.yml build

          echo "APIFY_API_TOKEN=${{ secrets.APIFY_API_TOKEN }}" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

          docker compose -f docker-compose.staging.yml up -d

          echo "Staging Deploy completato con successo tramite Docker!"
          DEPLOY_SCRIPT
