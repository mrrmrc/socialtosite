name: deploy-staging - Docker/SSH

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deployvps-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          cd openpage
          npm install --legacy-peer-deps
          npm run build

      - name: Test PHP syntax
        run: |
          sudo apt-get install -y php-cli
          php -l api/services/apify_client.php
          php tools/test_apify_credentials.php
          php -l api/services/video_source.php
          php -l api/services/ai.php
          php -l api/services/ingest.php
          php tools/test_video_source.php
          php -l public/site.php
          php -l api/services/openpage.php
          php -l api/services/design_references.php
          php tools/test_design_references.php
          php -l api/services/article_display.php
          php tools/test_article_display.php
          php tools/test_openpage_document.php
          php tools/test_profile_corrections.php
          php -l api/services/profile_knowledge.php
          php tools/test_profile_knowledge.php
          php tools/test_ai_health.php
          php tools/test_admin_operations.php
          php tools/test_admin_content.php
          php tools/test_session_identity.php
          php tools/test_password_recovery.php
          php tools/test_content_ideas.php
          php tools/test_opportunities.php
          php tools/test_opportunity_brief.php
          php tools/test_ai_reliability.php
          php -l api/services/openpage_versions.php
          php tools/test_openpage_versions.php
          php -l api/index.php
          php -l api/services/profile_interview.php

      - name: Test administrative role separation in browser
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s npm install --prefix "$RUNNER_TEMP/admin-browser" --no-save --package-lock=false --fetch-timeout=20000 --fetch-retries=2 playwright@1.64.1
          export NODE_PATH="$RUNNER_TEMP/admin-browser/node_modules"
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' | sudo tee /etc/apt/apt.conf.d/99-admin-browser-timeouts >/dev/null
          timeout 180s node "$NODE_PATH/playwright/cli.js" install --with-deps chromium
          node tools/run_admin_browser_tests.cjs

      - name: Prepara chiave SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Staging VPS via SSH/Docker
        shell: bash
        run: |
          ssh -T -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.STAGING_SSH_USER }}@${{ secrets.STAGING_SSH_HOST }} << 'DEPLOY_SCRIPT'
          set -e
          mkdir -p /opt/socialtosite-staging
          cd /opt/socialtosite-staging

          if [ ! -d ".git" ]; then
            git clone -b staging https://github.com/${{ github.repository }}.git .
          else
            git fetch origin staging
            git reset --hard origin/staging
          fi

          echo "<?php" > config/config.php
          echo "define('JWT_SECRET', 'staging_secret_key_1234567890');" >> config/config.php

          docker compose -f docker-compose.staging.yml build

          echo "APIFY_API_TOKEN=${{ secrets.APIFY_API_TOKEN }}" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

          docker compose -f docker-compose.staging.yml up -d

          echo "Staging Deploy completato con successo tramite Docker!"
          DEPLOY_SCRIPT

      - name: Verify published administration and customer workspaces
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/admin-browser/node_modules"
          node tools/test_admin_release_shell.cjs http://45.138.202.132:8088

      - name: Save administration browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: administration-browser-evidence
          path: |
            artifacts/admin-*.png
            artifacts/control-room-*.png
            artifacts/release-shell-*.png
          if-no-files-found: ignore




