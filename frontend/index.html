async function apiFetch(path, opts = {}, token = null) {
  const headers = { 'Content-Type': 'application/json' };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  const r = await fetch(`${API}${path}`, { ...opts, headers: { ...headers, ...opts.headers } });
  const data = await r.json();
  if (r.status === 401) { localStorage.removeItem('sts_token'); window.location.reload(); return; }
  if (!r.ok) throw new Error(data.error || `Errore server (${r.status})`);
  return data;
}

// ── Quill Editor Wrapper ────────────────────────────────────────────────────
function QuillEditor({ value, onChange, style }) {
  const containerRef = useRef(null);
  const editorRef = useRef(null);
  const quillRef = useRef(null);
  const isInternalChange = useRef(false);

  useEffect(() => {
    if (!editorRef.current || quillRef.current) return;
    const quill = new Quill(editorRef.current, {
      theme: 'snow',
      modules: {
        toolbar: [
          [{ header: [1, 2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['blockquote', 'link', 'image'],
          ['clean']
        ]
      },
      placeholder: "Scrivi il testo dell'articolo..."
    });
    quillRef.current = quill;
    if (value) quill.root.innerHTML = value;
    quill.on('text-change', () => {
      isInternalChange.current = true;
      const html = quill.root.innerHTML;
      if (onChange) onChange(html === '<p><br></p>' ? '' : html);
      isInternalChange.current = false;
    });
    return () => { quillRef.current = null; };
  }, []);

  useEffect(() => {
    if (quillRef.current && !isInternalChange.current) {
      const currentHtml = quillRef.current.root.innerHTML;
      if (value !== currentHtml) quillRef.current.root.innerHTML = value || '';
    }
  }, [value]);

  return (
    <div ref={containerRef} style={style}>
      <div ref={editorRef} style={{ minHeight: '300px' }} />
    </div>
  );
}

function detectPlatformFromUrl(url) {
  const u = (url || '').toLowerCase();
  if (u.includes('youtube.com') || u.includes('youtu.be')) return 'youtube';
  if (u.includes('tiktok.com')) return 'tiktok';
  if (u.includes('instagram.com')) return 'instagram';
  if (u.includes('facebook.com') || u.includes('fb.com') || u.includes('fb.watch')) return 'facebook';
  if (u.match(/^https?:\/\//) && !u.includes('twitter') && !u.includes('x.com')) return 'website';
  return null;
}

// Screen: Connetti Social (Onboarding Step 1)
// ═══════════════════════════════════════════════════════════════
function ConnectScreen({ token, onDone }) {
  const [connections, setConnections] = useState([]);
  const [sources, setSources] = useState([]);
  const [addUrl, setAddUrl] = useState('');
  const [addLabel, setAddLabel] = useState('');
  const [addMsg, setAddMsg] = useState(null);
  const [addLoading, setAddLoading] = useState(false);
  const [loadingChannels, setLoadingChannels] = useState(true);

  useEffect(() => {
    // Controlla parametri URL per callback OAuth
    const params = new URLSearchParams(window.location.search);
    const connected = params.get('connected');
    const oauthError = params.get('error');
    if (connected) {
      window.history.replaceState({}, '', window.location.pathname);
      setAddMsg({ ok: true, text: `✅ Connessione OAuth completata con successo!` });
    } else if (oauthError) {
      const platform = params.get('platform') || 'il social';
      setAddMsg({ ok: false, text: `Connessione a ${platform} non riuscita (${oauthError}). Riprova.` });
      window.history.replaceState({}, '', window.location.pathname);
    }
    loadChannels();
  }, []);

  async function loadChannels() {
    setLoadingChannels(true);
    try {
      const [connData, srcData] = await Promise.all([
        apiFetch('/api/index.php?action=social-connections', {}, token),
        apiFetch('/api/index.php?action=social-sources-get', {}, token)
      ]);
      setConnections(connData);
      setSources(srcData);
    } catch (e) {
      console.error(e);
    }
    setLoadingChannels(false);
  }

  async function handleAddChannel(e) {
    e.preventDefault();
    setAddMsg(null);
    const url = addUrl.trim();
    if (!url) return;
    const platform = detectPlatformFromUrl(url);
    if (!platform) {
      setAddMsg({ ok: false, text: 'URL non riconosciuto. Inserisci il link al tuo profilo su Instagram, TikTok, YouTube, Facebook o il tuo sito web.' });
      return;
    }
    setAddLoading(true);
    try {
      await apiFetch('/api/index.php?action=social-source-upsert', {
        method: 'POST',
        body: JSON.stringify({ platform, label: addLabel || (SOCIAL[platform]?.label || platform), url })
      }, token);
      setAddMsg({ ok: true, text: `✅ Profilo ${SOCIAL[platform]?.label || platform} aggiunto!` });
      setAddUrl('');
      setAddLabel('');
      await loadChannels();
    } catch (err) {
      setAddMsg({ ok: false, text: err.message });
    }
    setAddLoading(false);
  }

  async function connectOAuth(platform) {
    window.location.href = `/api/auth/oauth_redirect.php?platform=${platform}&token=${localStorage.getItem('sts_token') || ''}`;
  }

  async function removeChannel(channel) {
    if (!window.confirm(`Rimuovere il canale "${channel.label || channel.platform}"?`)) return;
    if (channel.type === 'scraping') {
      await apiFetch('/api/index.php?action=social-source-delete', { method: 'POST', body: JSON.stringify({ id: channel.sourceId }) }, token);
    } else {
      await apiFetch('/api/index.php?action=social-disconnect', { method: 'POST', body: JSON.stringify({ platform: channel.rawPlatform }) }, token);
    }
    await loadChannels();
  }

  // Costruisci lista unificata (stessa logica della Dashboard)
  const allChannels = [];
  connections.filter(c => c.active).forEach(c => {
    allChannels.push({
      key: 'oauth_' + c.platform,
      type: 'oauth',
      platform: c.platform === 'instagram_login' ? 'instagram' : c.platform,
      rawPlatform: c.platform,
      handle: c.handle,
      label: c.handle ? `@${c.handle}` : '',
    });
  });
  sources.forEach(s => {
    const hasOAuth = connections.some(c => c.active && (c.platform === s.platform || (c.platform === 'instagram_login' && s.platform === 'instagram')));
    allChannels.push({
      key: 'src_' + s.id,
      type: 'scraping',
      platform: s.platform,
      rawPlatform: s.platform,
      sourceId: s.id,
      url: s.url,
      label: s.label,
      hasDuplicateOAuth: hasOAuth,
    });
  });

  const connectedCount = allChannels.length;
  const detectedPlatform = detectPlatformFromUrl(addUrl);
  const connByPlatform = connections.reduce((acc, c) => ({ ...acc, [c.platform]: c }), {});

  return (
    <div style={{ minHeight: '100vh', padding: '2rem 1rem', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ width: '100%', maxWidth: '600px' }}>
        
        <div style={{ textAlign: 'center', marginBottom: '2rem' }}>
          <h1 style={{ fontSize: '32px', color: 'var(--primary)', textShadow: '0 0 10px var(--primary-light)' }}>Incolla i tuoi canali</h1>
          <p style={{ color: 'var(--text-muted)', fontSize: '16px', fontWeight: 500 }}>
            Incolla qui i link (Instagram, TikTok, YouTube, ecc.) e lascia che l'AI li trasformi nel tuo sito web in automatico.
          </p>
        </div>

        {/* Form Aggiungi Canale */}
        <div className="glass-modal" style={{ marginBottom: '2rem', padding: '2rem' }}>
          <form onSubmit={handleAddChannel} style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
            <div style={{ position: 'relative' }}>
              <input
                type="url"
                placeholder="es: https://www.instagram.com/tuoprofilo/"
                value={addUrl}
                onChange={e => { setAddUrl(e.target.value); setAddMsg(null); }}
                style={{ paddingLeft: detectedPlatform ? '56px' : '20px', fontSize: '18px', padding: '20px', width: '100%' }}
              />
              {detectedPlatform && (
                <span style={{ position: 'absolute', left: '16px', top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none' }}>
                  <img src={SOCIAL[detectedPlatform]?.icon || ''} alt="" style={{ width: 24, height: 24, opacity: 0.8 }} />
                </span>
              )}
            </div>
            
            {detectedPlatform && (
              <div style={{ fontSize: '13px', color: 'var(--primary)', padding: '10px 14px', background: 'var(--primary-light)', borderRadius: 'var(--radius-sm)', fontWeight: 700, border: '1px solid rgba(0,240,255,0.2)' }}>
                ✓ Perfetto! Rilevato: {SOCIAL[detectedPlatform]?.label || detectedPlatform}
              </div>
            )}
            
            <button type="submit" className="btn btn-primary" disabled={addLoading || !addUrl.trim()} style={{ padding: '18px', fontSize: '16px', marginTop: '8px' }}>
              {addLoading ? '⟳ Attendere...' : '+ AGGIUNGI CANALE'}
            </button>
          </form>
          {addMsg && (
            <div style={{ marginTop: '16px', padding: '14px', borderRadius: 'var(--radius-sm)', fontSize: '14px', fontWeight: 600,
              background: addMsg.ok ? 'var(--teal-light)' : 'var(--red-light)',
              color: addMsg.ok ? 'var(--teal)' : 'var(--red)', border: `1px solid ${addMsg.ok ? 'rgba(16,185,129,0.3)' : 'rgba(255,59,48,0.3)'}` }}>
              {addMsg.text}
            </div>
          )}
        </div>

        {/* Canali Aggiunti */}
        {allChannels.length > 0 && (
          <div style={{ marginBottom: '2rem' }}>
            <h3 style={{ fontSize: '13px', color: 'var(--text-muted)', marginBottom: '12px', textTransform: 'uppercase', letterSpacing: '1px' }}>I Tuoi Canali</h3>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
              {allChannels.map(channel => (
                <div key={channel.key} className="glass-modal" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '16px 20px', borderRadius: 'var(--radius)' }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
                    <div style={{ width: '48px', height: '48px', borderRadius: '12px', background: 'rgba(255,255,255,0.05)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                      <SocialIcon platform={channel.platform} size={28} />
                    </div>
                    <div>
                      <div style={{ fontWeight: 800, fontSize: '16px' }}>{channel.label || channel.platform}</div>
                      <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                        {channel.type === 'oauth' ? 'Connesso via App Ufficiale' : channel.url}
                      </div>
                    </div>
                  </div>
                  <button onClick={() => removeChannel(channel)} style={{ background: 'var(--red-light)', border: '1px solid rgba(255,59,48,0.3)', color: 'var(--red)', cursor: 'pointer', fontSize: '13px', fontWeight: 700, padding: '8px 16px', borderRadius: '20px' }}>
                    Rimuovi
                  </button>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Connessioni OAuth (YouTube, Facebook) */}
        <div style={{ marginBottom: '2rem', textAlign: 'center' }}>
          <div style={{ fontSize: '13px', fontWeight: 600, color: 'var(--text-muted)', marginBottom: '16px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
            Preferisci il login sicuro ufficiale?
          </div>
          <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', flexWrap: 'wrap' }}>
            {['youtube', 'facebook', 'tiktok'].map(platform => {
              const conn = connByPlatform[platform];
              const isConnected = !!conn && conn.active;
              return (
                <button key={platform}
                  onClick={() => !isConnected && connectOAuth(platform)}
                  disabled={isConnected}
                  style={{
                    display: 'flex', alignItems: 'center', gap: '8px',
                    padding: '12px 20px', borderRadius: '20px', fontSize: '14px', fontWeight: 700,
                    background: isConnected ? 'var(--teal-light)' : 'rgba(255,255,255,0.05)',
                    border: `1px solid ${isConnected ? 'var(--teal)' : 'var(--border)'}`,
                    color: isConnected ? 'var(--teal)' : 'var(--text)',
                    cursor: isConnected ? 'default' : 'pointer',
                    backdropFilter: 'blur(10px)'
                  }}>
                  <img src={SOCIAL[platform]?.icon} alt="" style={{ width: 20, height: 20 }} />
                  {isConnected ? `Collegato` : `Entra con ${SOCIAL[platform]?.label}`}
                </button>
              );
            })}
          </div>
        </div>

        <button className="btn btn-primary btn-full" disabled={connectedCount === 0 || loadingChannels} onClick={onDone}
          style={{ fontSize: '18px', padding: '20px', borderRadius: 'var(--radius)' }}>
          {connectedCount === 0 ? 'Aggiungi un canale per iniziare' : `CREA IL MIO SITO →`}
        </button>
      </div>
    </div>
  );
}

    { text: 'Generazione testo SEO-friendly...', status: 'pending' },
    { text: 'Estrazione tag e parole chiave...', status: 'pending' },
    { text: 'Calcolo score SEO...', status: 'pending' },
    { text: 'Composizione pagina finale...', status: 'pending' },
  ]);
  const [done, setDone] = useState(false);

  useEffect(() => {
    let i = 0;
    // Anima i log mentre il backend lavora
    const animate = () => {
      setLogs(prev => prev.map((l, idx) => idx < i ? { ...l, status: 'done' } : idx === i ? { ...l, status: 'active' } : l));
      i++;
      if (i <= logs.length) setTimeout(animate, 900 + Math.random() * 500);
    };
    animate();

    // Chiama il backend per sync reale
    apiFetch('/api/index.php?action=sync', { method: 'POST' }, token)
      .then(() => { setDone(true); })
      .catch(() => { setDone(true); }); // Mostra preview anche in caso di errore parziale
  }, []);

  return (
    <div style={{ minHeight: '100vh', padding: '2rem 1rem', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ width: '100%', maxWidth: '500px' }}>
        <ProgressBar step={2} />
        
        <div className="glass-modal" style={{ textAlign: 'center', marginTop: '2rem' }}>
          <h1 style={{ fontSize: '28px', color: 'var(--primary)', marginBottom: '0.5rem' }}>AI al lavoro...</h1>
          <p style={{ color: 'var(--text-muted)', marginBottom: '2rem', fontSize: '15px', fontWeight: 500 }}>
            Stiamo analizzando i tuoi contenuti e costruendo il sito. Ci vogliono circa 60 secondi.
          </p>
          
          <div style={{ background: 'rgba(0,0,0,0.4)', borderRadius: 'var(--radius-sm)', padding: '1.5rem', textAlign: 'left', fontFamily: 'monospace', fontSize: '14px' }}>
            {logs.map((log, i) => (
              <div key={i} style={{ display: 'flex', gap: '12px', alignItems: 'center', marginBottom: '12px',
                color: log.status === 'done' ? 'var(--teal)' : log.status === 'active' ? 'var(--primary)' : 'var(--text-faint)',
                transition: 'color .3s', fontWeight: 600 }}>
                <span>{log.status === 'done' ? '✓' : log.status === 'active' ? '⟳' : '○'}</span>
                <span>{log.text}</span>
              </div>
            ))}
          </div>
          
          {done && (
            <button className="btn btn-primary btn-full" onClick={onDone}
              style={{ marginTop: '2rem', fontSize: '18px', padding: '16px' }}>
              VISUALIZZA IL TUO SITO →
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

  // Funzione helper per elaborare la coda (ora in parallelo)
  async function processPendingLoop(isScan = false) {
    try {
      const pending = await apiFetch('/api/index.php?action=pending-posts', {}, token);
      if (!pending || pending.length === 0) return;
      
      setProcessingQueue(pending.map(p => ({ ...p, status: 'pending' })));

      const total = pending.length;
      let completed = 0;
      const concurrency = 4; // Elabora fino a 4 post in parallelo

      const updateProgress = () => {
        const msg = `Elaborazione AI: completati ${completed} su ${total} post...`;
        if (isScan) setScanMsg({ ok: true, text: msg, loading: true });
        else setSyncMsg({ ok: true, text: msg, loading: true });
      };

      updateProgress();

      const processPost = async (post) => {
        setProcessingQueue(prev => prev.map(p => p.id === post.id ? { ...p, status: 'processing' } : p));
        let errorMsg = null;
        try {
          await apiFetch('/api/index.php?action=process-pending', {
            method: 'POST',
            body: JSON.stringify({ id: post.id })
          }, token);
        } catch (e) {
          console.error("Errore post", post.id, e);
          errorMsg = e.message;
        }
        
        setProcessingQueue(prev => prev.map(p => p.id === post.id ? { ...p, status: errorMsg ? 'error' : 'done' } : p));
        completed++;
        updateProgress();
      };

      for (let i = 0; i < pending.length; i += concurrency) {
        const chunk = pending.slice(i, i + concurrency);
        await Promise.all(chunk.map(post => processPost(post)));
      }

      const finalMsg = `Orchestrazione finale del sito in corso...`;
      if (isScan) setScanMsg({ ok: true, text: finalMsg, loading: true });
      else setSyncMsg({ ok: true, text: finalMsg, loading: true });

      try {
        await apiFetch('/api/index.php?action=finalize-sync', {
          method: 'POST',
          body: JSON.stringify({
             profile_summary: typeof profileDraft !== 'undefined' ? profileDraft : '',
             role_mission: typeof roleMissionDraft !== 'undefined' ? roleMissionDraft : '',
             content_strategy: typeof strategyDraft !== 'undefined' ? strategyDraft : ''
          })
        }, token);
      } catch (e) {
        console.error("Errore orchestrazione", e);
      }
      
      const doneMsg = `Elaborazione di ${total} post e aggiornamento sito completati.`;
      if (isScan) setScanMsg({ ok: true, text: doneMsg });
      else setSyncMsg({ ok: true, text: doneMsg });
      
      // Ritardiamo la pulizia della coda per far vedere all'utente il completamento
      setTimeout(() => setProcessingQueue([]), 5000);
      
      await loadDrafts();
      await loadData();
    } catch (e) {
      console.error(e);
      setProcessingQueue([]);
    }
  }

  async function syncNow() {

  async function scanSources() {
    if (!sources || sources.length === 0) {

    setScanning(true); 
    setScanMsg({ ok: true, text: 'Inizio acquisizione...', loading: true });
    setScanProgress(sources.map(s => ({ id: s.id, platform: s.platform, label: s.label, status: 'pending', details: '' })));
    
    let totalImported = 0;
    let totalFound = 0;
    let totalDuplicates = 0;
    let totalErrors = 0;

    for (let i = 0; i < sources.length; i++) {
      const source = sources[i];
      setScanProgress(prev => prev.map(s => s.id === source.id ? { ...s, status: 'scanning' } : s));
      setScanMsg({ ok: true, text: `Acquisizione post da ${source.label || source.platform} in corso... (${i+1}/${sources.length})`, loading: true });
      try {
        const res = await apiFetch('/api/index.php?action=scan-sources', {
          method: 'POST',
          body: JSON.stringify({
            source_id: source.id,
            limit: parseInt(syncLimit) || 20,
            profile_summary: profileDraft,
            role_mission: roleMissionDraft,
            content_strategy: strategyDraft
          })
        }, token);
        const r = res.report;
        totalImported += (r.imported || 0);
        totalFound += (r.found || 0);
        totalDuplicates += (r.duplicates || 0);
        setScanProgress(prev => prev.map(s => s.id === source.id ? { ...s, status: 'done', details: `${r.imported} post importati (su ${r.found} trovati)` } : s));
      } catch (err) {

        totalErrors++;
        setScanProgress(prev => prev.map(s => s.id === source.id ? { ...s, status: 'error', details: err.message } : s));
      }
    }
    
    setScanMsg({ ok: true, text: `Acquisizione completata. Avvio elaborazione AI in background dei ${totalImported} nuovi post...` });
    setTimeout(() => setScanProgress([]), 3000);
    await processPendingLoop(true);
    setScanning(false);
  }

  // ── Funzioni gestione canali (tab "I miei canali") ─────────────────────
  async function handleAddChannel(e) {
    e.preventDefault();
    setAddMsg(null);
    const url = addUrl.trim();
    if (!url) return;
    const platform = detectPlatformFromUrl(url);
    if (!platform) {
      setAddMsg({ ok: false, text: 'URL non riconosciuto. Inserisci il link al tuo profilo su Instagram, TikTok, YouTube, Facebook o il tuo sito web.' });
      return;
    }
    setAddLoading(true);
    try {
      await apiFetch('/api/index.php?action=social-source-upsert', {
        method: 'POST',
        body: JSON.stringify({ platform, label: addLabel || (SOCIAL[platform]?.label || platform), url })
      }, token);
      setAddMsg({ ok: true, text: `✅ Profilo ${SOCIAL[platform]?.label || platform} aggiunto! Clicca "Sincronizza tutti" per importare i contenuti.` });
      setAddUrl('');
      setAddLabel('');
      await loadData();
    } catch (err) {
      setAddMsg({ ok: false, text: err.message });
    }
    setAddLoading(false);
  }

  async function connectOAuth(platform) {
    window.location.href = `/api/auth/oauth_redirect.php?platform=${platform}&token=${localStorage.getItem('sts_token') || ''}`;
  }

  async function removeChannel(channel) {
    if (!window.confirm(`Rimuovere il canale "${channel.label || channel.platform}"?`)) return;
    if (channel.type === 'scraping') {
      await apiFetch('/api/index.php?action=social-source-delete', { method: 'POST', body: JSON.stringify({ id: channel.sourceId }) }, token);
    } else {
      await apiFetch('/api/index.php?action=social-disconnect', { method: 'POST', body: JSON.stringify({ platform: channel.rawPlatform }) }, token);
    }
    await loadData();
  }


  const site = data?.site;
  const posts = data?.posts || [];
  const connections = data?.connections || [];
  const sources = data?.sources || [];
  const sourceByPlatform = sources.reduce((acc, source) => ({ ...acc, [source.platform]: source }), {});
  const connByPlatform = connections.reduce((acc, c) => ({ ...acc, [c.platform]: c }), {});
  const siteUrl = `${API.replace('3001', '3000')}/s/${user.slug}`;

  return (
    <div style={{ minHeight: '100vh', display: 'flex' }}>
      {/* Sidebar Laterale (solo Desktop) */}
      <div className="desktop-sidebar" style={{ width: '280px', background: 'var(--surface)', borderRight: '1px solid var(--border)', flexDirection: 'column', position: 'fixed', height: '100vh', top: 0, left: 0, zIndex: 50, boxShadow: 'var(--shadow)' }}>
        <div style={{ padding: '20px 24px', borderBottom: '1px solid var(--border)' }}>

        </div>
        <div style={{ padding: '24px 16px', display: 'flex', flexDirection: 'column', gap: '8px', flex: 1, overflowY: 'auto' }}>
          {[
            { id: 'overview', icon: '🏠', label: 'Home' },
            { id: 'site', icon: '📝', label: 'Articoli' },
            { id: 'sources', icon: '📡', label: 'Canali' },
            { id: 'settings', icon: '🎨', label: 'Design' },
            { id: 'general', icon: '⚙️', label: 'Impostazioni' },
            { id: 'seo', icon: '📈', label: 'SEO' },
            ...(user.role === 'admin' ? [{ id: 'admin', icon: '🛠', label: 'Admin' }] : [])
          ].map(item => (
            <button key={item.id} onClick={() => setTab(item.id)}
              style={{
                padding: '14px 16px', borderRadius: '12px', textAlign: 'left',
                background: tab === item.id ? 'var(--primary-light)' : 'transparent',
                color: tab === item.id ? 'var(--primary)' : 'var(--text-muted)',
                fontWeight: tab === item.id ? 700 : 600,
                display: 'flex', alignItems: 'center', gap: '14px',
                border: tab === item.id ? '1px solid var(--primary-light)' : '1px solid transparent',
                cursor: 'pointer', transition: 'all 0.2s ease',
              }}>
              <span style={{ fontSize: '20px' }}>{item.icon}</span> {item.label}
            </button>
          ))}
        </div>
        <div style={{ padding: '24px', borderTop: '1px solid var(--border)' }}>
          <div style={{ fontSize: '14px', fontWeight: 700, color: 'var(--text)', marginBottom: '12px', overflow: 'hidden', textOverflow: 'ellipsis' }}>{user.email}</div>
          <button className="btn btn-outline btn-full" onClick={onLogout} style={{ padding: '12px', borderRadius: '12px', fontWeight: 700, border: '1px solid var(--border-strong)' }}>Esci</button>
        </div>
      </div>

      {/* Main Content Area */}
      <div className="dashboard-main">
        {/* Mobile Header (Only visible on mobile) */}
        <div className="mobile-top-header">
          <div style={{ fontWeight: 800, fontSize: '16px', color: 'var(--primary)' }}>allsocialto<span style={{ color: 'var(--text-muted)' }}>web</span><span style={{ fontSize: '11px', color: 'var(--text-faint)', fontWeight: 400 }}>.com</span></div>
          <button className="btn btn-primary" onClick={runSiteAi} disabled={siteAiLoading} style={{ padding: '8px 16px', fontSize: '12px' }}>
            {siteAiLoading ? '✨' : '✨ SITO AI'}
          </button>
        </div>

        <div style={{ maxWidth: '1000px', margin: '0 auto' }}>
          {/* Header Action Bar */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '2.5rem' }}>
            <h1 style={{ margin: 0, fontSize: '28px', fontWeight: 700, color: 'var(--text)' }}>
              {tab === 'overview' && 'Panoramica'}
              {tab === 'site' && 'Gestione Contenuti'}
              {tab === 'sources' && 'I miei canali'}
              {tab === 'settings' && 'Design & Aspetto'}
                {tab === 'general' && 'Impostazioni Generali'}
              {tab === 'seo' && 'SEO & Analisi'}
              {tab === 'admin' && 'Pannello Admin'}
            </h1>
            <div style={{ display: 'flex', gap: '12px' }}>
              <button className="btn btn-primary" onClick={runSiteAi} disabled={siteAiLoading} style={{ background: siteAiLoading ? 'var(--purple-dark)' : 'linear-gradient(135deg, #7F77DD, #534AB7)', fontSize: '14px', fontWeight: 600, boxShadow: '0 4px 12px rgba(127,119,221,0.3)', padding: '10px 20px', borderRadius: '10px' }} title="L'AI genera il tuo sito personalizzato al 100% in base al tuo profilo">
                {siteAiLoading ? '✨ Generazione...' : '✨ Genera SITO AI'}
              </button>
              <button className="btn btn-outline" onClick={syncNow} disabled={syncing} style={{ background: 'var(--surface)', border: '1px solid var(--border-strong)', padding: '10px 20px', borderRadius: '10px' }}>
                {syncing ? '⟳ Sync...' : '↻ Aggiorna Social'}
              </button>
            </div>
          </div>
        {/* Banner SITO AI */}
        {siteAiResult && (
          <div style={{ background: 'linear-gradient(135deg,#534AB7,#7F77DD)', color: '#fff', borderRadius: 'var(--radius)', padding: '1.25rem 1.5rem', marginBottom: '1.25rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '1rem', flexWrap: 'wrap' }}>
            <div>
              <div style={{ fontWeight: 700, fontSize: '15px', marginBottom: '4px' }}>✨ Sito AI generato con successo!</div>
              <div style={{ fontSize: '13px', opacity: 0.85 }}>Tema: <b>{siteAiResult.theme}</b> · Colore: <b>{siteAiResult.accent_color}</b> · Tagline: "{siteAiResult.hero_tagline}"</div>
            </div>
            <div style={{ display: 'flex', gap: '8px' }}>
              <a href={siteUrl} target="_blank" rel="noopener" style={{ background: 'rgba(255,255,255,0.2)', color: '#fff', padding: '7px 16px', borderRadius: 'var(--radius-sm)', fontSize: '13px', fontWeight: 600, textDecoration: 'none' }}>🌍 Vedi sito</a>
              <button onClick={() => setSiteAiResult(null)} style={{ background: 'transparent', color: 'rgba(255,255,255,0.6)', border: 'none', cursor: 'pointer', fontSize: '18px' }}>✕</button>
            </div>
          </div>
        )}
        {syncMsg && (
          <div style={{ marginBottom: '1rem', padding: '12px 16px', borderRadius: 'var(--radius-sm)', fontSize: '14px',
            background: syncMsg.ok ? (syncMsg.loading ? 'var(--blue-light)' : 'var(--teal-light)') : 'var(--red-light)',
            color: syncMsg.ok ? (syncMsg.loading ? '#1E40AF' : '#0F6E56') : 'var(--red)',
            display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div>{syncMsg.loading && <span style={{display:'inline-block', marginRight:'8px'}}>⟳</span>}{syncMsg.text}</div>
            {!syncMsg.loading && <button onClick={() => setSyncMsg(null)} style={{background:'none', border:'none', cursor:'pointer', fontSize:'16px'}}>✕</button>}
          </div>
        )}
        {tab === 'overview' && (
          <div style={{ display: 'flex', flexDirection: 'column', gap: '2rem' }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '1.25rem' }}>
              {[
                { n: posts.length, l: 'Contenuti elaborati', c: 'var(--primary)' },
                { n: sources.length, l: 'Canali collegati', c: 'var(--teal)' },
                { n: site?.seo_score || 0, l: 'Score SEO', c: (site?.seo_score >= 80) ? 'var(--teal)' : 'var(--amber)' },
                { n: posts.filter(p => p.media_type === 'VIDEO').length, l: 'Video trascritti', c: 'var(--primary-dark)' },
              ].map((s, i) => (
                <div key={i} className="card" style={{ padding: '1.5rem', display: 'flex', flexDirection: 'column', justifyContent: 'center', textAlign: 'center' }}>
                  <div style={{ fontSize: '42px', fontWeight: 800, color: s.c, lineHeight: 1, textShadow: `0 0 15px ${s.c}33` }}>{s.n}</div>
                  <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginTop: '12px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.5px' }}>{s.l}</div>
                </div>
              ))}
            </div>
            
            <div className="card" style={{ background: 'linear-gradient(135deg, var(--primary-dark), var(--primary))', color: '#fff', border: 'none', boxShadow: '0 10px 30px -10px rgba(0, 240, 255, 0.4)' }}>
              <h2 style={{ marginBottom: '1rem', color: '#fff', fontSize: '24px', letterSpacing: '-0.5px' }}>🌍 Il tuo sito è online</h2>
              <div style={{ display: 'flex', alignItems: 'center', gap: '1rem', flexWrap: 'wrap' }}>
                <div style={{ background: 'rgba(0,0,0,0.2)', padding: '16px 20px', borderRadius: '12px', fontFamily: 'monospace', fontSize: '16px', flex: 1, minWidth: '250px', border: '1px solid rgba(255,255,255,0.1)' }}>
                  {siteUrl}
                </div>
                <div style={{ display: 'flex', gap: '12px' }}>
                  <a href={siteUrl} target="_blank" rel="noopener" className="btn" style={{ background: '#000', color: '#fff', textDecoration: 'none', borderRadius: '12px' }}>Apri sito</a>
                  <button className="btn" onClick={() => navigator.clipboard.writeText(siteUrl).then(() => alert('Copiato!'))} style={{ background: 'rgba(255,255,255,0.2)', color: '#fff', borderRadius: '12px' }}>Copia link</button>
                </div>
              </div>
            </div>

            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))', gap: '1.5rem' }}>
              <div className="card">
                <h3 style={{ marginBottom: '1rem' }}>Sincronizzazione automatica</h3>
                <p style={{ fontSize: '14px', color: 'var(--text-muted)', marginBottom: '1rem' }}>
                  Il tuo sito si aggiorna automaticamente ogni 6 ore prelevando i contenuti dalle fonti social attive.
                </p>
                <div style={{ padding: '12px', background: 'var(--gray-light)', borderRadius: '8px', fontSize: '13px', display: 'flex', justifyContent: 'space-between' }}>
                  <span style={{ fontWeight: 600 }}>Ultimo sync:</span>
                  <span>{site?.last_sync ? new Date(site.last_sync).toLocaleString('it-IT') : 'Mai effettuato'}</span>
                </div>
              </div>
              
              <div className="card">
                <h3 style={{ marginBottom: '1rem' }}>Scorciatoie veloci</h3>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  <button onClick={() => setTab('settings')} className="btn btn-outline" style={{ justifyContent: 'flex-start' }}>🎨 Modifica i colori e il font</button>
                  <button onClick={() => setTab('sources')} className="btn btn-outline" style={{ justifyContent: 'flex-start' }}>➕ Aggiungi un nuovo canale social</button>
                  <button onClick={() => setTab('site')} className="btn btn-outline" style={{ justifyContent: 'flex-start' }}>✏️ Rivedi un articolo pubblicato</button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Tab: I miei canali (UNIFICATO) */}
        {tab === 'sources' && (() => {
          // Costruisci lista unificata: prima le connessioni OAuth, poi le sorgenti URL
          const allChannels = [];

          // Canali OAuth
          connections.filter(c => c.active).forEach(c => {
            allChannels.push({
              key: 'oauth_' + c.platform,
              type: 'oauth',
              platform: c.platform === 'instagram_login' ? 'instagram' : c.platform,
              rawPlatform: c.platform,
              handle: c.handle,
              since_date: c.since_date,
              auto_publish: c.auto_publish,
              max_posts: c.max_posts,
              label: c.handle ? `@${c.handle}` : '',
            });
          });

          // Sorgenti URL scraping
          sources.forEach(s => {
            // Evita duplicati se c'è già un OAuth per la stessa piattaforma
            const hasOAuth = connections.some(c => c.active && (c.platform === s.platform || (c.platform === 'instagram_login' && s.platform === 'instagram')));
            allChannels.push({
              key: 'src_' + s.id,
              type: 'scraping',
              platform: s.platform,
              rawPlatform: s.platform,
              sourceId: s.id,
              url: s.url,
              label: s.label,
              since_date: s.since_date,
              auto_publish: s.auto_publish,
              max_posts: s.max_posts,
              hasDuplicateOAuth: hasOAuth,
            });
          });


          const detectedPlatform = detectPlatformFromUrl(addUrl);

          return (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '1.5rem' }}>

              {/* Form Aggiungi Canale */}
              <div className="card">
                <h2 style={{ marginBottom: '0.5rem', fontSize: '18px' }}>➕ Aggiungi un canale</h2>
                <p style={{ fontSize: '13px', color: 'var(--text-muted)', marginBottom: '1.25rem' }}>
                  Incolla il link del tuo profilo social o del tuo sito web. Il sistema riconosce automaticamente la piattaforma e importa i tuoi contenuti.
                </p>
                <form onSubmit={handleAddChannel} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  <div style={{ position: 'relative' }}>
                    <input
                      type="url"
                      placeholder="https://www.instagram.com/nomeutente/ oppure https://tuosito.it"
                      value={addUrl}
                      onChange={e => { setAddUrl(e.target.value); setAddMsg(null); }}
                      style={{ paddingLeft: detectedPlatform ? '40px' : '16px', transition: 'padding 0.2s' }}
                    />
                    {detectedPlatform && (
                      <span style={{ position: 'absolute', left: '12px', top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none' }}>
                        <img src={SOCIAL[detectedPlatform]?.icon || ''} alt="" style={{ width: 18, height: 18 }} />
                      </span>
                    )}
                  </div>
                  {detectedPlatform && (
                    <div style={{ fontSize: '12px', color: 'var(--text-muted)', padding: '6px 10px', background: 'var(--purple-light)', borderRadius: 'var(--radius-sm)' }}>
                      ✓ Rilevato: <strong>{SOCIAL[detectedPlatform]?.label || detectedPlatform}</strong> — {PLATFORM_DESCRIPTIONS[detectedPlatform] || ''}
                    </div>
                  )}
                  <input
                    type="text"
                    placeholder="Etichetta (opzionale) — Es: Il mio account principale"
                    value={addLabel}
                    onChange={e => setAddLabel(e.target.value)}
                  />
                  <button type="submit" className="btn btn-primary" disabled={addLoading || !addUrl.trim()} style={{ alignSelf: 'flex-start', padding: '10px 24px' }}>
                    {addLoading ? '⟳ Aggiunta in corso...' : '+ Aggiungi canale'}
                  </button>
                </form>
                {addMsg && (
                  <div style={{ marginTop: '12px', padding: '10px 14px', borderRadius: 'var(--radius-sm)', fontSize: '13px',
                    background: addMsg.ok ? 'var(--teal-light)' : 'var(--red-light)',
                    color: addMsg.ok ? '#0F6E56' : 'var(--red)' }}>
                    {addMsg.text}
                  </div>
                )}

                {/* Connessioni OAuth avanzate (YouTube, Facebook) */}
                <div style={{ marginTop: '1.5rem', paddingTop: '1rem', borderTop: '1px solid var(--border)' }}>
                  <div style={{ fontSize: '12px', fontWeight: 600, color: 'var(--text-muted)', marginBottom: '10px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                    Oppure collega tramite accesso ufficiale (più affidabile per YouTube e Facebook)
                  </div>
                  <div style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
                    {['youtube', 'facebook'].map(platform => {
                      const conn = connByPlatform[platform];
                      const isConnected = !!conn && conn.active;
                      return (
                        <button key={platform}
                          onClick={() => !isConnected && connectOAuth(platform)}
                          disabled={isConnected}
                          style={{
                            display: 'flex', alignItems: 'center', gap: '8px',
                            padding: '8px 16px', borderRadius: 'var(--radius-sm)', fontSize: '13px', fontWeight: 500,
                            background: isConnected ? 'var(--teal-light)' : 'var(--surface)',
                            border: `1px solid ${isConnected ? 'var(--teal)' : 'var(--border-strong)'}`,
                            color: isConnected ? '#0F6E56' : 'var(--text)',
                            cursor: isConnected ? 'default' : 'pointer',
                          }}>
                          <img src={SOCIAL[platform]?.icon} alt="" style={{ width: 16, height: 16 }} />
                          {isConnected ? `✓ ${SOCIAL[platform]?.label} connesso come @${conn.handle}` : `Connetti ${SOCIAL[platform]?.label}`}
                        </button>
                      );
                    })}
                  </div>
                </div>
              </div>

              {/* Lista canali attivi */}
              <div className="card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                  <h2 style={{ margin: 0, fontSize: '18px' }}>📡 I tuoi canali ({allChannels.length})</h2>
                  {allChannels.length > 0 && (
                    <button onClick={scanSources} disabled={scanning}
                      className="btn btn-primary" style={{ fontSize: '13px', padding: '8px 18px' }}>
                      {scanning ? '⟳ Sincronizzazione...' : '🔄 Sincronizza tutti'}
                    </button>
                  )}
                </div>

                {allChannels.length === 0 ? (
                  <div style={{ textAlign: 'center', padding: '3rem 1rem', color: 'var(--text-muted)' }}>
                    <div style={{ fontSize: '48px', marginBottom: '1rem', opacity: 0.4 }}>📭</div>
                    <div style={{ fontWeight: 600, marginBottom: '0.5rem' }}>Nessun canale aggiunto</div>
                    <div style={{ fontSize: '13px' }}>Incolla il link del tuo profilo nel campo qui sopra per iniziare.</div>
                  </div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    {allChannels.map(channel => (
                      <div key={channel.key} style={{
                        padding: '14px 16px', borderRadius: 'var(--radius-sm)',
                        border: '1px solid var(--border-strong)', background: 'var(--bg)',
                        display: 'flex', flexDirection: 'column', gap: '10px'
                      }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                            <img src={SOCIAL[channel.platform]?.icon || SOCIAL['website']?.icon} alt="" style={{ width: 22, height: 22 }} />
                            <div>
                              <div style={{ fontWeight: 600, fontSize: '14px' }}>
                                {channel.label || (SOCIAL[channel.platform]?.label || channel.platform)}
                                {channel.url && <span style={{ fontWeight: 400, fontSize: '12px', color: 'var(--text-muted)', marginLeft: '8px' }}>
                                  <a href={channel.url} target="_blank" rel="noopener" style={{ color: 'var(--text-muted)', textDecoration: 'none' }}>
                                    {channel.url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '')}
                                  </a>
                                </span>}
                              </div>
                              <div style={{ fontSize: '11px', display: 'flex', gap: '6px', marginTop: '2px' }}>
                                <span style={{
                                  background: channel.type === 'oauth' ? 'var(--teal-light)' : 'var(--purple-light)',
                                  color: channel.type === 'oauth' ? '#0F6E56' : 'var(--purple-dark)',
                                  padding: '1px 7px', borderRadius: '10px', fontWeight: 500
                                }}>
                                  {channel.type === 'oauth' ? '🔗 Connesso con account' : '🔍 Acquisizione automatica'}
                                </span>
                              </div>
                            </div>
                          </div>

                            style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--text-muted)', fontSize: '18px', padding: '4px 8px', borderRadius: '4px' }}

                        </div>

                        {/* Impostazioni sync inline */}
                        <div style={{ display: 'grid', gridTemplateColumns: 'auto 1fr auto auto', gap: '10px', alignItems: 'center', paddingTop: '8px', borderTop: '1px solid var(--border)' }}>
                          <span style={{ fontSize: '12px', color: 'var(--text-muted)', whiteSpace: 'nowrap' }}>Dal:</span>
                          <input type="date" defaultValue={channel.since_date || ''}
                            title="Importa contenuti da questa data in poi"
                            onBlur={e => {
                              if (channel.type === 'oauth') saveConnectionSettings(channel.rawPlatform, e.target.value, channel.auto_publish ?? 1, channel.max_posts);
                              else savePlatformSource(channel.rawPlatform, channel.url, e.target.value, channel.auto_publish ?? 1, channel.max_posts);
                            }}
                            style={{ padding: '5px 8px', fontSize: '12px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border)', width: '100%' }} />
                          <input type="number" min="1" max="500" placeholder="Max" defaultValue={channel.max_posts || ''}
                            title="Numero massimo di post da importare"
                            onBlur={e => {
                              const val = e.target.value || null;
                              if (channel.type === 'oauth') saveConnectionSettings(channel.rawPlatform, channel.since_date, channel.auto_publish ?? 1, val);
                              else savePlatformSource(channel.rawPlatform, channel.url, channel.since_date, channel.auto_publish ?? 1, val);
                            }}
                            style={{ padding: '5px 8px', fontSize: '12px', borderRadius: 'var(--radius-sm)', border: '1px solid var(--border)', width: '70px' }} />
                          <label style={{ display: 'flex', alignItems: 'center', gap: '5px', fontSize: '12px', cursor: 'pointer', whiteSpace: 'nowrap' }}>
                            <input type="checkbox" defaultChecked={(channel.auto_publish ?? 1) === 1}
                              onChange={e => {
                                const ap = e.target.checked ? 1 : 0;
                                if (channel.type === 'oauth') saveConnectionSettings(channel.rawPlatform, channel.since_date, ap, channel.max_posts);
                                else savePlatformSource(channel.rawPlatform, channel.url, channel.since_date, ap, channel.max_posts);
                              }} />
                            Pubblica auto
                          </label>
                        </div>
                      </div>
                    ))}
                  </div>

                <button onClick={() => setEditingPost(null)} style={{ flex: '1 1 100px', background: 'transparent', color: 'var(--text)', border: '1px solid var(--border-strong)', padding: '16px', fontSize: '16px', fontWeight: 600, borderRadius: 'var(--radius-sm)', cursor: 'pointer', transition: 'background 0.2s' }}>
                  ❌ ANNULLA
                </button>
              </div>
            </div>
          </div>
        )}
      </div>
      </div>

      {/* Mobile Bottom Navigation */}
      <div className="mobile-nav">
        <button className={`mobile-nav-item ${tab === 'overview' ? 'active' : ''}`} onClick={() => setTab('overview')}>
          <span style={{fontSize: '20px'}}>🏠</span> Home
        </button>
        <button className={`mobile-nav-item ${tab === 'site' ? 'active' : ''}`} onClick={() => setTab('site')}>
          <span style={{fontSize: '20px'}}>📝</span> Articoli
        </button>
        
        <button className="mobile-fab" onClick={syncNow} disabled={syncing}>
          {syncing ? '⟳' : '↻'}
        </button>
        
        <button className={`mobile-nav-item ${tab === 'sources' ? 'active' : ''}`} onClick={() => setTab('sources')}>
          <span style={{fontSize: '20px'}}>📡</span> Canali
        </button>
        <button className={`mobile-nav-item ${tab === 'settings' ? 'active' : ''}`} onClick={() => setTab('settings')}>
          <span style={{fontSize: '20px'}}>⚙️</span> Menu
        </button>
      </div>
      
    </div>
  );
}

function AdminScreen({ token, currentUser, adminPrompts, updatePrompt }) {
  const [adminTab, setAdminTab] = useState('users');
  const [users, setUsers] = useState([]);
  const [logs, setLogs] = useState([]);
  const [processes, setProcesses] = useState([]);
  const [form, setForm] = useState({ name: '', email: '', password: '', role: 'user' });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  useEffect(() => { 
    if (adminTab === 'users') loadUsers(); 
    if (adminTab === 'logs') loadLogs();
    if (adminTab === 'processes') loadProcesses();
  }, [adminTab]);

  async function loadLogs() {
    try {
      const data = await apiFetch('/api/index.php?action=logs', {}, token);
      setLogs(data.entries || []);
    } catch (e) { setError(e.message); }
  }

  async function clearLogs() {
    if (!confirm('Sei sicuro di voler svuotare i log di sistema?')) return;
    try {
      await apiFetch('/api/index.php?action=logs-clear', { method: 'POST' }, token);
      await loadLogs();
    } catch (e) { setError(e.message); }
  }

  async function loadProcesses() {
    try {
      const data = await apiFetch('/api/index.php?action=admin-processes', {}, token);
      setProcesses(data.processes || []);
    } catch (e) { setError(e.message); }
  }

  async function killProcess(id) {
    if (!confirm('Eliminare questo processo in coda?')) return;
    try {
      await apiFetch('/api/index.php?action=admin-kill-process', { method: 'POST', body: JSON.stringify({id}) }, token);
      await loadProcesses();
    } catch (e) { setError(e.message); }
  }

  async function loadUsers() {
    try {
      const data = await apiFetch('/api/index.php?action=admin-users', {}, token);
      setUsers(data.users || []);
    } catch (e) {
      setError(e.message);
    }
  }

  async function createUser(e) {
    e.preventDefault();
    setLoading(true); setError('');
    try {
      await apiFetch('/api/index.php?action=admin-create-user', {
        method: 'POST',
        body: JSON.stringify(form)
      }, token);
      setForm({ name: '', email: '', password: '', role: 'user' });
      await loadUsers();
    } catch (e) {
      setError(e.message);
    }
    setLoading(false);
  }

  async function updateUser(id, patch) {
    setError('');
    try {
      await apiFetch('/api/index.php?action=admin-update-user', {
        method: 'POST',
        body: JSON.stringify({ id, ...patch })
      }, token);
      await loadUsers();
    } catch (e) {
      setError(e.message);
    }
  }

  async function deleteUser(id) {
    if (!confirm('Eliminare questo utente e tutti i suoi contenuti?')) return;
    setError('');
    try {
      await apiFetch('/api/index.php?action=admin-delete-user', {
        method: 'POST',
        body: JSON.stringify({ id })
      }, token);
      await loadUsers();
    } catch (e) {
      setError(e.message);
    }
  }

  async function impersonateUser(id) {
    if (!confirm('Vuoi accedere come questo utente? Dovrai rieffettuare il login per tornare amministratore.')) return;
    setError('');
    try {
      const data = await apiFetch('/api/index.php?action=admin-impersonate', {
        method: 'POST',
        body: JSON.stringify({ id })
      }, token);
      
      localStorage.setItem('sts_token', data.token);
      localStorage.setItem('sts_user', JSON.stringify(data.user));
      window.location.reload();
    } catch (e) {
      setError(e.message);
    }
  }

  return (
    <div>
      <div style={{ display: 'flex', gap: '8px', marginBottom: '1rem', flexWrap: 'wrap' }}>
        <button className={`btn ${adminTab === 'users' ? 'btn-primary' : 'btn-outline'}`} onClick={() => setAdminTab('users')}>👤 Gestione Utenti</button>
        <button className={`btn ${adminTab === 'agents' ? 'btn-primary' : 'btn-outline'}`} onClick={() => setAdminTab('agents')}>🤖 Agenti Editoriali</button>
        <button className={`btn ${adminTab === 'prompts' ? 'btn-primary' : 'btn-outline'}`} onClick={() => setAdminTab('prompts')}>⚙️ Istruzioni AI</button>
        <button className={`btn ${adminTab === 'processes' ? 'btn-primary' : 'btn-outline'}`} onClick={() => setAdminTab('processes')}>⏳ Processi Attivi</button>
        <button className={`btn ${adminTab === 'logs' ? 'btn-primary' : 'btn-outline'}`} onClick={() => setAdminTab('logs')}>📜 Log di Sistema</button>
      </div>

      {adminTab === 'users' && (
      <div>
        <div className="card" style={{ marginBottom: '1rem' }}>
          <h3 style={{ marginBottom: '1rem' }}>Crea nuovo utente</h3>
          <form onSubmit={createUser} style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
            <div className="form-group" style={{ marginBottom: 0 }}>
              <label className="label">Nome</label>
              <input type="text" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />
            </div>
            <div className="form-group" style={{ marginBottom: 0 }}>
              <label className="label">Email</label>
              <input type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })} required />
            </div>
            <div className="form-group" style={{ marginBottom: 0 }}>
              <label className="label">Password temporanea</label>
              <input type="password" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} required />
            </div>
            <div className="form-group" style={{ marginBottom: 0 }}>
              <label className="label">Ruolo</label>
              <select value={form.role} onChange={e => setForm({ ...form, role: e.target.value })}
                style={{ width: '100%', padding: '10px 14px', border: '1px solid var(--border-strong)', borderRadius: 'var(--radius-sm)', background: 'var(--surface)' }}>
                <option value="user">Utente</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <button className="btn btn-primary" disabled={loading} style={{ gridColumn: '1 / -1', justifyContent: 'center' }}>
              {loading ? 'Creazione...' : 'Crea utente'}
            </button>
          </form>
          {error && <div style={{ background: 'var(--red-light)', color: 'var(--red)', padding: '10px 14px', borderRadius: 'var(--radius-sm)', marginTop: '1rem', fontSize: '13px' }}>{error}</div>}
        </div>

        <div className="card">
          <h3 style={{ marginBottom: '1rem' }}>Lista Utenti</h3>
          {users.map(u => {
            const siteUrl = `${API.replace('3001', '3000')}/s/${u.slug}`;
            return (
              <div key={u.id} style={{ padding: '12px 0', borderBottom: '1px solid var(--border)' }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1.4fr .8fr .7fr auto', gap: '12px', alignItems: 'center' }}>
                  <div>
                    <div style={{ fontWeight: 600 }}>{u.name || u.email}</div>
                    <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{u.email}</div>
                    <a href={siteUrl} target="_blank" rel="noopener" style={{ fontSize: '12px', color: 'var(--purple)', textDecoration: 'none' }}>{siteUrl}</a>
                  </div>
                  <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>
                    <div>{u.posts_count} contenuti</div>
                    <div>{u.connections_count} app connesse</div>
                  </div>
                  <div style={{ display: 'grid', gap: '6px' }}>
                    <select value={u.role || 'user'} onChange={e => updateUser(u.id, { role: e.target.value })}
                      style={{ padding: '7px', border: '1px solid var(--border-strong)', borderRadius: 'var(--radius-sm)', background: 'var(--surface)' }}>
                      <option value="user">Utente</option>
                      <option value="admin">Admin</option>
                    </select>
                    <input type="text" defaultValue={u.plan || 'free'} onBlur={e => updateUser(u.id, { plan: e.target.value })}
                      style={{ padding: '7px', fontSize: '12px' }} />
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '6px' }}>
                    <button className="btn btn-outline" onClick={() => impersonateUser(u.id)} disabled={u.id === currentUser.id}
                      style={{ color: 'var(--purple)', borderColor: 'var(--purple-light)', padding: '6px', fontSize: '12px' }}>
                      Accedi come
                    </button>
                    <button className="btn btn-outline" onClick={() => deleteUser(u.id)} disabled={u.id === currentUser.id}
                      style={{ color: 'var(--red)', borderColor: 'var(--red-light)', padding: '6px', fontSize: '12px' }}>
                      Elimina
                    </button>
                  </div>
                </div>
                
                {u.sources && u.sources.length > 0 && (
                  <div style={{ marginTop: '12px', padding: '10px 14px', background: 'var(--surface)', borderRadius: 'var(--radius-sm)', border: '1px dashed var(--border-strong)' }}>
                    <div style={{ fontSize: '12px', fontWeight: 600, color: 'var(--text)', marginBottom: '8px' }}>🔗 Fonti Social Collegate:</div>
                    <div style={{ display: 'grid', gap: '6px' }}>
                      {u.sources.map(s => (
                        <div key={s.url} style={{ display: 'flex', alignItems: 'center', gap: '10px', fontSize: '12px' }}>
                          <span style={{ fontWeight: 600, textTransform: 'capitalize', color: 'var(--text-muted)', width: '70px' }}>{s.platform}</span>
                          <a href={s.url} target="_blank" rel="noopener" style={{ color: 'var(--purple)', textDecoration: 'none', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.url}</a>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
      )}

      {adminTab === 'agents' && (
      <div className="card">
        <h3 style={{ marginBottom: '1rem' }}>Agenti Editoriali degli Utenti</h3>
        <p style={{ fontSize: '13px', color: 'var(--text-muted)', marginBottom: '1rem' }}>
          Visualizza e modifica le direttive dell'agente assegnato ad ogni utente. L'agente usa questi dati per filtrare e armonizzare i post importati.
        </p>
        {users.map(u => (
          <div key={u.id} style={{ marginBottom: '1.5rem', paddingBottom: '1.5rem', borderBottom: '1px solid var(--border)' }}>
            <div style={{ fontWeight: 600, marginBottom: '8px' }}>{u.name || u.email} <span style={{ fontSize: '12px', fontWeight: 400, color: 'var(--text-muted)' }}>({u.email})</span></div>
            <div style={{ display: 'grid', gap: '10px' }}>
              <div>
                <label className="label">Ruolo e Missione</label>
                <textarea defaultValue={u.role_mission || ''} onBlur={e => updateUser(u.id, { role_mission: e.target.value })}
                  style={{ width: '100%', minHeight: '60px', padding: '8px 12px', fontSize: '13px', border: '1px solid var(--border-strong)', borderRadius: 'var(--radius-sm)', background: 'var(--surface)' }} />
              </div>
              <div>
                <label className="label">Strategia dei Contenuti</label>
                <textarea defaultValue={u.content_strategy || ''} onBlur={e => updateUser(u.id, { content_strategy: e.target.value })}
                  style={{ width: '100%', minHeight: '60px', padding: '8px 12px', fontSize: '13px', border: '1px solid var(--border-strong)', borderRadius: 'var(--radius-sm)', background: 'var(--surface)' }} />
              </div>
            </div>
          </div>
        ))}
      </div>
      )}

      {adminTab === 'prompts' && (
      <div className="card">
        <h3 style={{ marginBottom: '0.5rem' }}>🤖 Istruzioni Sistema Agenti AI</h3>
        <p style={{ fontSize: '13px', color: 'var(--text-muted)', marginBottom: '1.25rem', lineHeight: 1.6 }}>
          Ogni agente ha il suo prompt di sistema. Modificalo per cambiare come l'AI genera i contenuti.
          Le variabili <code style={{ background: 'var(--gray-light)', padding: '1px 5px', borderRadius: '4px' }}>{'{'+'profileSummary{'+'}'}</code>, <code style={{ background: 'var(--gray-light)', padding: '1px 5px', borderRadius: '4px' }}>{'{'+'roleMission{'+'}'}</code> etc. vengono sostituite automaticamente con i dati del profilo.
        </p>
        {adminPrompts.map(p => (
          <div key={p.id} style={{ marginBottom: '1.75rem', paddingBottom: '1.75rem', borderBottom: '1px solid var(--border)' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '8px' }}>
              <span style={{ background: 'var(--purple-light)', color: 'var(--purple-dark)', fontWeight: 700, fontSize: '13px', padding: '3px 12px', borderRadius: '20px' }}>
                {p.label || p.agent_name}
              </span>
              {p.description && <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>{p.description}</span>}
            </div>
            <textarea key={`${p.id}-${p.instructions}`} defaultValue={p.instructions}
              onBlur={e => updatePrompt(p.agent_name, e.target.value)}
              style={{ width: '100%', minHeight: '180px', padding: '12px', fontSize: '12px', fontFamily: 'monospace', border: '1px solid var(--border-strong)', borderRadius: 'var(--radius-sm)', background: 'var(--surface)', lineHeight: 1.6 }} />
          </div>
        ))}
        {adminPrompts.length === 0 && (
          <p style={{ color: 'var(--text-muted)', fontSize: '13px' }}>Nessun agente trovato. Visita <code>/api/index.php?action=migrate</code> per inizializzare.</p>
        )}
      </div>
      )}

      {adminTab === 'processes' && (
      <div className="card">
        <h3 style={{ marginBottom: '1rem' }}>Processi in Coda (AI Pendente)</h3>
        {processes.length === 0 ? (
          <p style={{ color: 'var(--text-muted)', fontSize: '13px' }}>Nessun post in attesa di elaborazione AI.</p>
        ) : (
          <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left', fontSize: '13px' }}>
            <thead>
              <tr style={{ borderBottom: '1px solid var(--border)', background: 'var(--gray-light)' }}>
                <th style={{ padding: '8px' }}>ID</th>
                <th style={{ padding: '8px' }}>Utente</th>
                <th style={{ padding: '8px' }}>Platform</th>
                <th style={{ padding: '8px' }}>Link</th>
                <th style={{ padding: '8px' }}>Azione</th>
              </tr>
            </thead>
            <tbody>
              {processes.map(p => (
                <tr key={p.id} style={{ borderBottom: '1px solid var(--border)' }}>
                  <td style={{ padding: '8px' }}>#{p.id}</td>
                  <td style={{ padding: '8px' }}>{p.name || p.email}</td>
                  <td style={{ padding: '8px' }}>{p.platform}</td>
                  <td style={{ padding: '8px' }}><a href={p.source_url} target="_blank" rel="noopener">Link</a></td>
                  <td style={{ padding: '8px' }}>
                    <button className="btn btn-outline" onClick={() => killProcess(p.id)} style={{ color: 'var(--red)', borderColor: 'var(--red-light)', padding: '4px 8px', fontSize: '12px' }}>Stoppa / Elimina</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      )}

      {adminTab === 'logs' && (
      <div className="card">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
          <h3 style={{ margin: 0 }}>Log di Sistema (Backend)</h3>
          <div style={{ display: 'flex', gap: '8px' }}>
            <button className="btn btn-outline" onClick={loadLogs} style={{ padding: '6px 12px', fontSize: '13px' }}>🔄 Aggiorna</button>
            <button className="btn btn-outline" onClick={clearLogs} style={{ color: 'var(--red)', borderColor: 'var(--red-light)', padding: '6px 12px', fontSize: '13px' }}>🗑 Svuota Log</button>
          </div>
        </div>
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', textAlign: 'left', fontSize: '12px', fontFamily: 'monospace' }}>
            <thead>
              <tr style={{ borderBottom: '1px solid var(--border)', background: 'var(--gray-light)' }}>
                <th style={{ padding: '8px' }}>Time</th>
                <th style={{ padding: '8px' }}>Level</th>
                <th style={{ padding: '8px' }}>Contesto</th>
                <th style={{ padding: '8px' }}>Messaggio</th>
                <th style={{ padding: '8px' }}>Dettagli</th>
              </tr>
            </thead>
            <tbody>
              {logs.map((l, idx) => (
                <tr key={idx} style={{ borderBottom: '1px solid var(--border)', background: l.level === 'error' ? 'var(--red-light)' : (l.level === 'warn' ? 'var(--amber-light)' : 'transparent') }}>
                  <td style={{ padding: '8px', whiteSpace: 'nowrap', color: 'var(--text-muted)' }}>{l.time}</td>
                  <td style={{ padding: '8px', fontWeight: 'bold', color: l.level === 'error' ? 'var(--red)' : (l.level === 'warn' ? 'var(--amber)' : (l.level === 'debug' ? 'var(--text-faint)' : 'var(--teal)')) }}>{l.level?.toUpperCase()}</td>
                  <td style={{ padding: '8px' }}>{l.ctx}</td>
                  <td style={{ padding: '8px', fontWeight: 500 }}>{l.msg}</td>
                  <td style={{ padding: '8px', color: 'var(--text-muted)', maxWidth: '400px', overflow: 'hidden', textOverflow: 'ellipsis' }} title={JSON.stringify(l.data)}>
                    {l.data ? JSON.stringify(l.data).substring(0, 100) + (JSON.stringify(l.data).length > 100 ? '...' : '') : ''}
                  </td>
                </tr>
              ))}
              {logs.length === 0 && (
                <tr><td colSpan="5" style={{ padding: '16px', textAlign: 'center', color: 'var(--text-muted)' }}>Nessun log trovato.</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>
      )}
      
      {/* Bottom Nav Bar (solo Mobile) */}
      <div className="mobile-nav">
        {[
          { id: 'overview', icon: '🏠', label: 'Home' },
          { id: 'site', icon: '📝', label: 'Articoli' },
          { id: 'sources', icon: '📡', label: 'Canali' },
          { id: 'settings', icon: '🎨', label: 'Design' }
        ].map(item => (
          <a key={item.id} href="#" onClick={(e) => { e.preventDefault(); setTab(item.id); }}
            className={`mobile-nav-item ${tab === item.id ? 'active' : ''}`}>
            <span className="nav-icon-wrap">
              <span style={{ fontSize: '20px' }}>{item.icon}</span>
            </span>
            {item.label}
          </a>
        ))}
      </div>
    </div>
  );
}

// ── Progress bar step ────────────────────────────────────────────────────────
function ProgressBar({ step }) {
  const pct = { 1: 33, 2: 66, 3: 100 }[step] || 0;
  return (
    <div style={{ marginBottom: '1.5rem' }}>
      <div style={{ fontSize: '12px', color: 'var(--text-faint)', marginBottom: '6px' }}>Passo {step} di 3</div>
      <div style={{ height: '4px', background: 'var(--gray-light)', borderRadius: '2px', overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${pct}%`, background: 'var(--purple)', borderRadius: '2px', transition: 'width .4s' }} />
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// App root — gestione screen
// ═══════════════════════════════════════════════════════════════
function App() {
  const [screen, setScreen] = useState('landing');
  const [token, setToken] = useState(null);
  const [user, setUser] = useState(null);
  const [deployInfo, setDeployInfo] = useState(null);

  useEffect(() => {
    const t = localStorage.getItem('sts_token');
    const u = localStorage.getItem('sts_user');
    if (t && u) {
      setToken(t); setUser(JSON.parse(u));
      setScreen('dashboard');
    }
    fetch('/deploy-info.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(setDeployInfo)
      .catch(() => {});
  }, []);

  function handleAuth(t, u) {
    setToken(t); setUser(u);
    setScreen('dashboard');
  }

  function logout() {
    localStorage.removeItem('sts_token');
    localStorage.removeItem('sts_user');
    setToken(null); setUser(null);
    setScreen('auth');
  }

  let content = null;
  if (screen === 'landing') content = <LandingScreen onGetStarted={() => setScreen('auth')} />;
  if (screen === 'auth') content = <AuthScreen onAuth={handleAuth} />;
  if (screen === 'connect') content = <ConnectScreen token={token} onDone={() => setScreen('generating')} />;
  if (screen === 'generating') content = <GeneratingScreen token={token} user={user} onDone={() => setScreen('dashboard')} />;
  if (screen === 'dashboard') content = <DashboardScreen token={token} user={user} onLogout={logout} />;

  return (
    <>
      {content}
      {deployInfo && (
        <footer style={{ textAlign: 'center', padding: '18px 12px', fontSize: '12px', color: 'var(--text-faint)' }}>
          Deploy {deployInfo.deployed_day || ''} {deployInfo.deployed_at || ''}
          {deployInfo.release ? ` · ${deployInfo.release}` : ''}
        </footer>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
