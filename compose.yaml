name: linkseoweb

x-app-environment: &app-environment
  TZ: Europe/Rome
  DB_HOST: db
  DB_NAME: ${LINKSEOWEB_DB_NAME:-linkseoweb}
  DB_USER: ${LINKSEOWEB_DB_USER:-linkseoweb}
  DB_PASS: ${LINKSEOWEB_DB_PASSWORD:?Imposta LINKSEOWEB_DB_PASSWORD nel file .env}
  DB_CHARSET: utf8mb4
  BASE_URL: ${BASE_URL:-http://localhost:8081}
  ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8081}
  JWT_SECRET: ${JWT_SECRET:?Imposta JWT_SECRET nel file .env}
  ANALYTICS_SALT: ${ANALYTICS_SALT:?Imposta ANALYTICS_SALT nel file .env}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  REFETCHER_API_KEY: ${REFETCHER_API_KEY:-}
  OPENCLAW_API_KEY: ${OPENCLAW_API_KEY:-}
  GSC_PROPERTY: ${GSC_PROPERTY:-}
  GCP_CREDENTIALS_PATH: /var/www/html/secrets/gcp-credentials.json
  SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-21600}

services:
  app:
    image: linkseoweb-app:latest
    build:
      context: .
    restart: unless-stopped
    environment: *app-environment
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8081}:80"
    volumes:
      - media_data:/var/www/html/public/media
      - ./secrets:/var/www/html/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  cron:
    image: linkseoweb-app:latest
    restart: unless-stopped
    command: ["linkseoweb-cron"]
    environment: *app-environment
    volumes:
      - media_data:/var/www/html/public/media
      - ./secrets:/var/www/html/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      TZ: Europe/Rome
      MARIADB_DATABASE: ${LINKSEOWEB_DB_NAME:-linkseoweb}
      MARIADB_USER: ${LINKSEOWEB_DB_USER:-linkseoweb}
      MARIADB_PASSWORD: ${LINKSEOWEB_DB_PASSWORD:?Imposta LINKSEOWEB_DB_PASSWORD nel file .env}
      MARIADB_ROOT_PASSWORD: ${LINKSEOWEB_DB_ROOT_PASSWORD:?Imposta LINKSEOWEB_DB_ROOT_PASSWORD nel file .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p\"$$MARIADB_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:
    # Mantiene i dati creati dal primo deploy, prima del rebranding.
    name: socialtosite_db_data
  media_data:
    name: socialtosite_media_data
